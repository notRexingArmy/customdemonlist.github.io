<!-- ================= LIST SECTION (AREDL STYLE) ================= -->
<div id="mainListSection" class="hidden absolute inset-0 flex flex-col lg:flex-row bg-dark-900 animate-fade-in">
    
    <!-- COLUMN 1: SIDEBAR LIST -->
    <div id="levelSidebarContainer" class="w-full lg:w-auto flex-shrink-0 flex flex-col border-r border-dark-600 bg-dark-900/50 backdrop-blur-md relative z-20" style="width: 400px; min-width: 300px; max-width: 600px;">
        <!-- Header / Search -->
        <div class="p-4 border-b border-dark-600 space-y-3 relative">
            <div class="flex w-full gap-2 mb-2">
                <button id="listTabClassic" class="flex-1 py-3 bg-accent-orange text-white font-bold text-sm rounded-lg shadow-lg shadow-orange-500/20 transition-all hover:bg-orange-600">CLASSIC</button>
                <button id="listTabPlatformer" class="flex-1 py-3 bg-dark-800 text-gray-400 font-bold text-sm rounded-lg border border-dark-600 hover:bg-dark-700 hover:text-white transition-all">PLATFORMER</button>
            </div>
            
            <!-- Search & Filter Container -->
            <div class="flex gap-2">
                <div class="relative flex-1">
                    <input type="text" id="listSearchInput" placeholder="Search" class="w-full bg-dark-800 border border-dark-600 rounded-lg py-2 pl-9 pr-3 text-sm text-white focus:ring-1 focus:ring-accent-orange focus:border-transparent outline-none transition-all">
                    <i data-lucide="search" class="absolute left-3 top-2.5 w-4 h-4 text-gray-500"></i>
                </div>
                <button id="filterBtn" class="bg-dark-800 border border-dark-600 rounded-lg p-2 text-gray-400 hover:text-white hover:border-accent-orange transition-colors relative">
                    <i data-lucide="filter" class="w-5 h-5"></i>
                    <div id="activeFiltersDot" class="hidden absolute top-1 right-1 w-2 h-2 bg-accent-orange rounded-full"></div>
                </button>
            </div>
        </div>
        
        <!-- Scrollable List -->
        <div id="levelSidebar" class="flex-1 overflow-y-auto custom-scrollbar">
            <!-- JS Injected List Items -->
        </div>
    </div>

    <!-- RESIZER 1 (Left) -->
    <div id="resizerLeft" class="hidden lg:block w-1 bg-dark-600 hover:bg-accent-orange cursor-col-resize z-30 transition-colors"></div>

    <!-- COLUMN 2: LEVEL DETAILS (MIDDLE) -->
    <div class="flex-1 overflow-y-auto custom-scrollbar bg-dark-900 relative min-w-[400px]">
        <!-- Background Art (Optional, blurred behind) -->
        <div class="absolute inset-0 bg-gradient-to-b from-dark-800/50 to-dark-900 z-0 pointer-events-none"></div>

        <div id="levelDetailsContainer" class="relative z-10 p-6 lg:p-10 w-full max-w-[1600px] mx-auto min-h-full flex flex-col">
            <!-- JS Injected Details -->
            <div class="flex flex-col items-center justify-center h-full text-gray-500 mt-20">
                <i data-lucide="loader" class="w-8 h-8 animate-spin mb-4 text-accent-orange"></i>
                <p>Loading list...</p>
            </div>
        </div>
    </div>

    <!-- RESIZER 2 (Right) -->
    <div id="resizerRight" class="hidden lg:block w-1 bg-dark-600 hover:bg-accent-orange cursor-col-resize z-30 transition-colors"></div>

    <!-- COLUMN 3: RECORDS (RIGHT) -->
    <div id="levelRecordsContainer" class="w-full lg:w-auto flex-shrink-0 flex flex-col border-l border-dark-600 bg-dark-900/50 backdrop-blur-md" style="width: 400px; min-width: 300px; max-width: 600px;">
        <div class="p-4 border-b border-dark-600 flex justify-between items-center">
            <h3 class="font-bold text-white text-lg" id="recordsHeader">Records (0)</h3>
        </div>
        <!-- Records Search -->
        <div class="p-3 border-b border-dark-600">
             <div class="relative">
                <input type="text" placeholder="Search record" class="w-full bg-dark-800 border border-dark-600 rounded py-1.5 pl-8 pr-2 text-xs text-white focus:border-accent-blue outline-none">
                <i data-lucide="search" class="absolute left-2.5 top-2 w-3.5 h-3.5 text-gray-500"></i>
            </div>
        </div>
        
        <div id="levelRecords" class="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-1">
            <!-- JS Injected Records -->
        </div>
        
        <!-- Pagination (Mock) -->
        <div class="p-3 border-t border-dark-600 flex justify-center gap-2">
            <button class="px-2 py-1 text-xs text-gray-500 hover:text-white">Previous</button>
            <button class="w-6 h-6 bg-accent-orange text-black font-bold text-xs rounded flex items-center justify-center">1</button>
            <button class="px-2 py-1 text-xs text-gray-500 hover:text-white">Next</button>
        </div>
    </div>
</div>
